name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true
      # kernel/native cgo links against prebuilt static libs under build/native/ (gitignored).
      # Build the Linux libs first. Android/Windows libs need NDK/mingw and are built on those toolchains.
      - name: build native libs (linux)
        run: make -f native/Makefile linux vector-linux
      - name: C gate (ASan + Valgrind)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          bash native/test-c.sh
      # kernel/desktopbind (desktop JNI bridge) needs JDK jni.h; built on desktop toolchains, not this Linux CI.
      - name: select packages (exclude desktop JNI bridge)
        run: echo "PKGS=$(go list ./... | grep -v /desktopbind | tr '\n' ' ')" >> "$GITHUB_ENV"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet $PKGS
      - name: go build
        run: go build $PKGS
      - name: go test (with coverage)
        run: go test $PKGS -coverprofile=coverage.out -covermode=atomic
      - name: enforce coverage >= 80%
        run: |
          go tool cover -func=coverage.out | tail -1
          COV=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')
          echo "total statement coverage: ${COV}%"
          awk -v c="$COV" 'BEGIN { if (c+0 < 80) { print "FAIL: coverage " c "% is below 80%"; exit 1 } }'
      - name: go test -race (concurrent packages)
        run: go test -race ./kernel/bus/... ./kernel/orchestrator/... ./kernel/proactive/...
      - name: layering guard (core must not import capability plugins)
        run: bash scripts/check-open-split.sh
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0 && govulncheck $PKGS
      - name: staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2 && staticcheck $PKGS
      - name: hello-kernel demo smoke
        run: go run ./examples/hello-kernel
