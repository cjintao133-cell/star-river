<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="820" height="360" rx="12" fill="#0d1117"/>
  <rect width="820" height="40" rx="12" fill="#161b22"/>
  <rect y="28" width="820" height="12" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="410" y="25" fill="#8b949e" font-size="13" text-anchor="middle">go run ./examples/hello-kernel</text>

  <g font-size="15" letter-spacing="0.2">
    <text x="24" y="78" fill="#c9d1d9">$ go run ./examples/hello-kernel</text>
    <text x="24" y="106" fill="#58a6ff">== Star River Microkernel · hello-kernel ==</text>

    <text x="24" y="146" fill="#7ee787">[bus]</text>
    <text x="96" y="146" fill="#c9d1d9">received doorbell  topic="kernel.started" source="hello-kernel"</text>

    <text x="24" y="176" fill="#7ee787">[memory]</text>
    <text x="112" y="176" fill="#c9d1d9">encoded 2 memories</text>
    <text x="24" y="202" fill="#7ee787">[memory]</text>
    <text x="112" y="202" fill="#d2a8ff">recall</text>
    <text x="180" y="202" fill="#c9d1d9">"the user is building a local-first AI kernel"</text>
    <text x="24" y="228" fill="#7ee787">[memory]</text>
    <text x="112" y="228" fill="#c9d1d9">review m1 retention=</text>
    <text x="300" y="228" fill="#79c0ff">1.00</text>

    <text x="24" y="258" fill="#7ee787">[emotion]</text>
    <text x="120" y="258" fill="#c9d1d9">arousal 0.30 -&gt; </text>
    <text x="248" y="258" fill="#79c0ff">0.70</text>
    <text x="300" y="258" fill="#c9d1d9">valence 0.00 -&gt; </text>
    <text x="470" y="258" fill="#79c0ff">0.30</text>

    <text x="24" y="300" fill="#3fb950">OK — bus + memory + emotion ran locally, no network, no key.</text>
  </g>
  <text x="24" y="336" fill="#6e7681" font-size="12"># offline · ~5s · zero API key · Go + C</text>
</svg>
